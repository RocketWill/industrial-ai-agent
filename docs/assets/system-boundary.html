<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    h1 { font:600 28px/1.15 'Space Grotesk',sans-serif; letter-spacing:-.02em; margin-bottom:20px; }
    svg { width:100%; min-width:960px; display:block; }
  </style>
</head>

        <text x="1120" y="212" text-anchor="middle" fill="#6b7280" font-family="IBM Plex Mono" font-size="8">Markdown · uploads</text>
      </g>

      <text x="176" y="676" fill="#4b5563" font-family="Open Sans" font-size="8">deterministic focal boundary</text>
