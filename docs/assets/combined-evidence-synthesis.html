<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combined Evidence synthesis and persistence</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Open+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0} body{background:#fafaf7;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;font-family:'Open Sans',sans-serif}.frame{width:100%;max-width:1280px}.eyebrow{color:#4b5563;font:500 8px/1.4 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}h1{font:600 28px/1.15 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin-bottom:20px}svg{width:100%;min-width:960px;display:block}
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Sequence · synthesis and persistence</p>
    <h1>Combined Evidence synthesis and persistence</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="combined-synthesis-title combined-synthesis-desc">
      <title id="combined-synthesis-title">Combined Evidence synthesis and persistence</title>
      <desc id="combined-synthesis-desc">Sequence showing the API asking an optional model to synthesize available evidence, validating the candidate, and either persisting a grounded answer or returning a safe fallback.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4b5563"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3b82f6"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2563eb"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#fafaf7"/>

      <line x1="136" y1="128" x2="136" y2="612" stroke="rgba(17,24,39,.20)" stroke-dasharray="3 3"/>
      <line x1="388" y1="128" x2="388" y2="612" stroke="rgba(17,24,39,.20)" stroke-dasharray="3 3"/>
      <line x1="640" y1="128" x2="640" y2="612" stroke="rgba(17,24,39,.20)" stroke-dasharray="3 3"/>
      <line x1="892" y1="128" x2="892" y2="612" stroke="rgba(17,24,39,.20)" stroke-dasharray="3 3"/>
      <line x1="1144" y1="128" x2="1144" y2="612" stroke="rgba(17,24,39,.20)" stroke-dasharray="3 3"/>

      <line x1="388" y1="188" x2="640" y2="188" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="440" y="164" width="148" height="12" rx="2" fill="#fafaf7"/><text x="514" y="172" text-anchor="middle" fill="#2563eb" font-family="IBM Plex Mono" font-size="8">SYNTHESIZE EVIDENCE</text>
      <line x1="640" y1="252" x2="388" y2="252" stroke="#4b5563" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <rect x="440" y="228" width="148" height="12" rx="2" fill="#fafaf7"/><text x="514" y="236" text-anchor="middle" fill="#4b5563" font-family="IBM Plex Mono" font-size="8">CANDIDATE / FAILURE</text>
      <line x1="388" y1="316" x2="892" y2="316" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="560" y="292" width="160" height="12" rx="2" fill="#fafaf7"/><text x="640" y="300" text-anchor="middle" fill="#4b5563" font-family="IBM Plex Mono" font-size="8">VALIDATE CLAIM BOUNDARY</text>
      <line x1="892" y1="372" x2="388" y2="372" stroke="#4b5563" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <rect x="568" y="348" width="144" height="12" rx="2" fill="#fafaf7"/><text x="640" y="356" text-anchor="middle" fill="#4b5563" font-family="IBM Plex Mono" font-size="8">ACCEPT / REJECT</text>

      <rect x="344" y="404" width="844" height="196" rx="4" fill="rgba(17,24,39,.02)" stroke="rgba(17,24,39,.22)"/>
      <rect x="344" y="404" width="48" height="16" rx="2" fill="#fafaf7" stroke="rgba(17,24,39,.22)"/>
      <text x="368" y="416" text-anchor="middle" fill="#4b5563" font-family="IBM Plex Mono" font-size="8" letter-spacing="1">ALT</text>
      <text x="404" y="436" fill="#4b5563" font-family="IBM Plex Mono" font-size="8">[grounded non-empty answer]</text>
      <line x1="388" y1="468" x2="1144" y2="468" stroke="#4b5563" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="656" y="444" width="220" height="12" rx="2" fill="#fafaf7"/><text x="766" y="452" text-anchor="middle" fill="#4b5563" font-family="IBM Plex Mono" font-size="8">PERSIST ANSWER + SNAPSHOT</text>
      <line x1="388" y1="516" x2="136" y2="516" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="184" y="492" width="156" height="12" rx="2" fill="#fafaf7"/><text x="262" y="500" text-anchor="middle" fill="#3b82f6" font-family="IBM Plex Mono" font-size="8">ANSWER + EVIDENCE</text>
      <line x1="352" y1="536" x2="1180" y2="536" stroke="rgba(17,24,39,.20)" stroke-dasharray="4 3"/>
      <text x="404" y="556" fill="#4b5563" font-family="IBM Plex Mono" font-size="8">[synthesis or validation failure]</text>
      <line x1="388" y1="580" x2="136" y2="580" stroke="#4b5563" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <rect x="164" y="556" width="196" height="12" rx="2" fill="#fafaf7"/><text x="262" y="564" text-anchor="middle" fill="#4b5563" font-family="IBM Plex Mono" font-size="8">SAFE FALLBACK + EVIDENCE</text>

      <rect x="132" y="508" width="8" height="80" fill="rgba(17,24,39,.06)" stroke="#4b5563" stroke-width=".8"/>
      <rect x="384" y="184" width="8" height="408" fill="rgba(59,130,246,.10)" stroke="#3b82f6" stroke-width=".8"/>
      <rect x="636" y="184" width="8" height="80" fill="rgba(17,24,39,.06)" stroke="#4b5563" stroke-width=".8"/>
      <rect x="888" y="312" width="8" height="72" fill="rgba(17,24,39,.06)" stroke="#4b5563" stroke-width=".8"/>
      <rect x="1140" y="464" width="8" height="16" fill="rgba(17,24,39,.06)" stroke="#4b5563" stroke-width=".8"/>

      <g><rect x="56" y="64" width="160" height="64" rx="6" fill="#fff" stroke="#111827"/><text x="136" y="92" text-anchor="middle" fill="#111827" font-family="Open Sans" font-size="12" font-weight="600">Workbench</text><text x="136" y="112" text-anchor="middle" fill="#6b7280" font-family="IBM Plex Mono" font-size="8">evidence + ephemeral notes</text></g>
      <g><rect x="308" y="64" width="160" height="64" rx="6" fill="rgba(59,130,246,.10)" stroke="#3b82f6" stroke-width="1.2"/><text x="388" y="92" text-anchor="middle" fill="#111827" font-family="Open Sans" font-size="12" font-weight="600">API / SSE runner</text><text x="388" y="112" text-anchor="middle" fill="#6b7280" font-family="IBM Plex Mono" font-size="8">application boundary</text></g>
      <g><rect x="560" y="64" width="160" height="64" rx="6" fill="rgba(17,24,39,.02)" stroke="rgba(17,24,39,.28)" stroke-dasharray="4 3"/><text x="640" y="92" text-anchor="middle" fill="#111827" font-family="Open Sans" font-size="12" font-weight="600">Optional model</text><text x="640" y="112" text-anchor="middle" fill="#6b7280" font-family="IBM Plex Mono" font-size="8">untrusted prose</text></g>
      <g><rect x="812" y="64" width="160" height="64" rx="6" fill="#fff" stroke="#111827"/><text x="892" y="92" text-anchor="middle" fill="#111827" font-family="Open Sans" font-size="12" font-weight="600">Validator</text><text x="892" y="112" text-anchor="middle" fill="#6b7280" font-family="IBM Plex Mono" font-size="8">deterministic checks</text></g>
      <g><rect x="1064" y="64" width="160" height="64" rx="6" fill="rgba(17,24,39,.05)" stroke="#4b5563"/><text x="1144" y="92" text-anchor="middle" fill="#111827" font-family="Open Sans" font-size="12" font-weight="600">SQLite</text><text x="1144" y="112" text-anchor="middle" fill="#6b7280" font-family="IBM Plex Mono" font-size="8">message + snapshot</text></g>

      <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(17,24,39,.12)"/>
      <text x="40" y="676" fill="#6b7280" font-family="IBM Plex Mono" font-size="8" letter-spacing="1.2">MODEL TEXT IS VALIDATED BEFORE PERSISTENCE · WORKING NOTES ARE NOT STORED</text>
    </svg>
  </main>
</body>
</html>
