<!DOCTYPE html>

<body>

      <g><rect x="1064" y="64" width="160" height="64" rx="6" fill="#fff" stroke="#111827"/><text x="1144" y="92" text-anchor="middle" fill="#111827" font-family="Open Sans" font-size="12" font-weight="600">Document Search</text><text x="1144" y="112" text-anchor="middle" fill="#6b7280" font-family="IBM Plex Mono" font-size="8">fictional sources</text></g>

      <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(17,24,39,.12)"/>
      <text x="40" y="676" fill="#6b7280" font-family="IBM Plex Mono" font-size="8" letter-spacing="1.2">TIME FLOWS TOP TO BOTTOM · RETURNS ARE DASHED</text>
