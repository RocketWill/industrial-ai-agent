[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industrial-agent-api"
version = "0.1.0"
description = "FastAPI backend for the Industrial AI Agent portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic",
  "fastapi",
  "httpx>=0.28.1",
  "langgraph>=0.6,<0.7",
  "pydantic-settings",
  "python-multipart>=0.0.32",
  "sqlalchemy",
  "uvicorn",
]

[dependency-groups]
dev = [
  "httpx2",
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
