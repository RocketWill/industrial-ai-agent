name: Deterministic CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Python 3.12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_DATABASE_URL: sqlite:///./ci.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv 0.12.0
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install locked backend dependencies
        run: uv sync --locked

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run backend tests
        run: uv run pytest -q

      - name: Run Ruff
        run: uv run ruff check .

      - name: Build backend package
        run: uv build

      - name: Run deterministic evaluation
        run: uv run industrial-agent-eval

  frontend:
    name: Frontend — Node.js 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Run TypeScript checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
